services:
  web:
    build: .
    network_mode: "host"
    container_name: ghost_web
    command: python app.py
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  worker:
    build: .
    container_name: ghost_worker
    command: celery -A app.celery worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - web
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ghost_redis
    ports:
      - "6379:6379"
    restart: unless-stopped