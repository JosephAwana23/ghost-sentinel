<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost-Sentinel Mobile</title>
    
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Code Syntax Highlighter (Tokyo Night Theme) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-dim: #9ca3af;
            --border: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-block-end: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--accent);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.875rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .metric {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            font-weight: 700;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Updated Console CSS to support Markdown formatting cleanly */
        .output-console {
            background: #000;
            color: #10b981;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            overflow-x: auto;
            line-height: 1.6;
        }

        .output-console pre {
            background: #111827; /* Darker background for code blocks */
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            overflow-x: auto;
        }
        
        .output-console code {
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Ghost-Sentinel</h1>
        <span style="color: var(--accent);">● ONLINE</span>
    </div>

    <div class="card">
        <div class="card-title">System Status</div>
        <div class="metric" id="uptime">Loading...</div>
        <div style="color: var(--text-dim); font-size: 0.85rem; margin-top: 4px;" id="proc">Processes: --</div>
    </div>

    <div class="card">
        <div class="card-title">Target Configuration</div>
        <input type="text" id="target" placeholder="192.168.1.1 or subnet" style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #000; color: var(--accent); margin-bottom: 12px; box-sizing: border-box;">
    </div>

    <div class="card">
        <div class="card-title">Recon & Scanning</div>
        <button class="btn" onclick="triggerScan()" style="margin-bottom: 8px;">Audit Open Ports</button>
        <button class="btn" onclick="triggerDiscover()" style="margin-bottom: 8px; background-color: #3b82f6;">Network Discovery</button>
        <button class="btn" onclick="triggerPortScan()" style="margin-bottom: 8px; background-color: #f59e0b;">Port Scan</button>
        <button class="btn" onclick="triggerServices()" style="margin-bottom: 8px; background-color: #8b5cf6;">Service Enum</button>
    </div>

    <div class="card">
        <div class="card-title">OSINT & DNS</div>
        <button class="btn" onclick="triggerDns()" style="margin-bottom: 8px; background-color: #ec4899;">DNS Lookup</button>
        <button class="btn" onclick="triggerWhois()" style="margin-bottom: 8px; background-color: #06b6d4;">WHOIS Lookup</button>
        <button class="btn" onclick="triggerTraceroute()" style="margin-bottom: 8px; background-color: #14b8a6;">Traceroute</button>
    </div>

    <div class="card">
        <div class="card-title">Web & Certificate Scanning</div>
        <button class="btn" onclick="triggerWeb()" style="margin-bottom: 8px; background-color: #f97316;">Web Scan (Nikto)</button>
        <button class="btn" onclick="triggerSSL()" style="margin-bottom: 8px; background-color: #eab308;">SSL Cert Scan</button>
    </div>

    <div class="card">
        <div class="card-title">Network Enumeration</div>
        <button class="btn" onclick="triggerSMB()" style="background-color: #a855f7;">SMB Enum (Windows)</button>
    </div>

    <div class="card">
        <div class="card-title">Console Output</div>
        <!-- Changed to a div to support Markdown HTML injection -->
        <div id="output" class="output-console">System ready for commands...</div>
    </div>

    <script>
        // Initialize Markdown Syntax Highlighting
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                return hljs.highlight(code, { language }).value;
            }
        });

        async function fetchTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                const data = await res.json();
                document.getElementById('uptime').innerText = data.uptime;
                document.getElementById('proc').innerText = `Active Processes: ${data.active_processes}`;
            } catch (e) {
                console.error("Telemetry error:", e);
            }
        }

        function getTarget() {
            return document.getElementById('target').value || 'localhost';
        }

        async function triggerScan() {
            const out = document.getElementById('output');
            out.innerHTML = "Running socket audit...";
            try {
                const res = await fetch('/api/scan', { method: 'POST' });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error executing scan.";
            }
        }

        async function triggerDiscover() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Running network discovery on ${target}...`;
            try {
                const res = await fetch('/api/discover', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Discovery Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: Discovery failed. Ensure nmap is installed.";
            }
        }

        async function triggerPortScan() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Scanning ports on ${target}...`;
            try {
                const res = await fetch('/api/ports', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Port Scan Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: Port scan failed.";
            }
        }

        async function triggerServices() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Enumerating services on ${target}...`;
            try {
                const res = await fetch('/api/services', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Service Enumeration:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: Service enumeration failed.";
            }
        }

        async function triggerDns() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Resolving DNS for ${target}...`;
            try {
                const res = await fetch('/api/dns', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] DNS Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: DNS lookup failed.";
            }
        }

        async function triggerWhois() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Looking up WHOIS for ${target}...`;
            try {
                const res = await fetch('/api/whois', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] WHOIS Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: WHOIS lookup failed.";
            }
        }

        async function triggerSSL() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Scanning SSL/TLS on ${target}...`;
            try {
                const res = await fetch('/api/ssl', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] SSL Scan Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: SSL scan failed.";
            }
        }

        async function triggerSMB() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Enumerating SMB shares on ${target}...`;
            try {
                const res = await fetch('/api/smb', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] SMB Enumeration:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: SMB enumeration failed (enum4linux required).";
            }
        }

        async function triggerWeb() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Scanning web vulnerabilities on ${target}...`;
            try {
                const res = await fetch('/api/web', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Web Scan Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: Web scan failed (nikto required).";
            }
        }

        async function triggerTraceroute() {
            const out = document.getElementById('output');
            const target = getTarget();
            out.innerHTML = `Tracing route to ${target}...`;
            try {
                const res = await fetch('/api/traceroute', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target })
                });
                const data = await res.json();
                out.innerHTML = marked.parse(`**[${data.time}] Traceroute Results:**\n\n${data.result}`);
            } catch (e) {
                out.innerHTML = "Error: Traceroute failed.";
            }
        }

        fetchTelemetry();
        setInterval(fetchTelemetry, 5000);
    </script>
</body>
</html>
